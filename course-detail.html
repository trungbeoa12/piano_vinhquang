<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <script src="js/common-head.js"></script>
</head>
<body data-page="course-detail" data-nav-current="courses" data-footer-contact-href="index.html#contact">

    <div id="site-header-mount"></div>

            data-secondary-href="account.html"
            data-secondary-label="Xem tài khoản demo"

    <div id="site-footer-mount"></div>

    <script src="js/auth.js"></script>
    <script src="js/app-common.js"></script>
    <script src="js/site-header.js"></script>
    <script src="js/site-shell.js"></script>
    <script src="js/utils/url.js"></script>
