<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản — Piano Vinh Quang</title>
    <meta name="description" content="Trang tài khoản demo để đăng nhập và truy cập các khóa học đã được cấp quyền.">
    <script src="js/common-head.js"></script>
</head>
<body data-page="account" data-nav-current="account" data-footer-contact-href="index.html#contact">
    <div class="snowflakes" id="snowflakes"></div>
    <div id="site-header-mount"></div>

    <main class="page-main">
        <div
            data-site-hero
            data-title="Tài khoản"
            data-lead="Đăng nhập demo để xem luồng “Khóa học của tôi”. Trên môi trường thật, bước này thay bằng SSO / email magic link / backend của bạn."
        ></div>

        <div class="pvq-account-grid">
            <div id="account-guest" class="pvq-panel">
                <h2>Đăng nhập (demo)</h2>
                <form id="demo-login-form" class="pvq-form-stack">
                    <div class="form-group">
                        <label for="demo-email">Email (tuỳ chọn)</label>
                        <input type="email" id="demo-email" name="email" placeholder="ban@email.com" autocomplete="username">
                    </div>
                    <button type="submit" class="cta-btn cta-btn-primary" style="width:100%;justify-content:center;border:none;cursor:pointer">Đăng nhập thử</button>
                </form>
                <p class="pvq-muted" style="margin-top:14px">Demo gán sẵn quyền hai khóa trong catalog để bạn mở bài học và học liệu.</p>
            </div>

            <div id="account-user" class="pvq-panel" style="display:none">
                <h2>Xin chào</h2>
                <p style="margin-bottom:8px"><strong id="account-email-display">—</strong></p>
                <button type="button" id="logout-btn" class="cta-btn cta-btn-secondary" style="border:none;cursor:pointer;margin-bottom:24px">Đăng xuất</button>

                <h2 style="margin-top:8px">Khóa học của tôi</h2>
                <div id="account-courses-list"></div>
            </div>
        </div>
        <div
            data-site-cta
            data-badge="Hỗ trợ truy cập"
            data-title="Muốn triển khai luồng đăng nhập thật?"
            data-lead="Phần demo hiện giữ mục tiêu minh họa quyền truy cập học liệu. Sau này bạn có thể nối tiếp bằng SSO, magic link hoặc backend học viên riêng."
            data-primary-href="index.html#contact"
            data-primary-label="Trao đổi giải pháp"
        ></div>
    </main>

    <div id="site-footer-mount"></div>

    <script src="js/auth.js"></script>
    <script src="js/app-common.js"></script>
    <script src="js/site-header.js"></script>
    <script src="js/site-shell.js"></script>
    <script src="js/data/content-loader.js"></script>
    <script src="js/pages/account.js"></script>
</body>
</html>
