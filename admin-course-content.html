<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Course Content — Piano Vinh Quang</title>
    <meta name="description" content="Placeholder cho bước tiếp theo: xem lesson và sửa nội dung khóa học.">
    <script src="js/common-head.js"></script>
</head>
<body data-page="admin-course-content" data-footer-contact-href="index.html#contact">
    <div class="snowflakes" id="snowflakes"></div>
    <div id="site-header-mount"></div>

    <main class="page-main page-main--account">
        <div class="pvq-account-shell pvq-dashboard-shell">
            <section class="pvq-panel pvq-dashboard-section" style="margin-bottom:24px">
                <p class="pvq-account-kicker">Course Content</p>
                <h2 id="admin-course-content-title">Đang tải khóa học…</h2>
                <p id="admin-course-content-copy" class="pvq-muted">
                    Xem tổng quan khóa học và danh sách lesson để chuẩn bị cho bước sửa nội dung.
                </p>
                <div class="pvq-course-access-actions" style="margin-top:18px">
                    <a href="/admin/courses" class="cta-btn cta-btn-secondary">Quay lại danh sách khóa học</a>
                </div>
            </section>

            <section class="pvq-panel pvq-dashboard-section" style="margin-bottom:24px">
                <p class="pvq-account-kicker">Course Summary</p>
                <div id="admin-course-summary"></div>
            </section>

            <section class="pvq-panel pvq-dashboard-section">
                <p class="pvq-account-kicker">Lessons</p>
                <h2>Danh sách lesson</h2>
                <p id="admin-course-content-feedback" class="pvq-muted pvq-account-feedback" aria-live="polite"></p>
                <div id="admin-course-lessons-list"></div>
            </section>

            <section class="pvq-panel pvq-dashboard-section" style="margin-top:24px">
                <p class="pvq-account-kicker">Lesson Editor</p>
                <h2 id="admin-lesson-editor-title">Chọn một lesson để sửa</h2>
                <p id="admin-lesson-editor-feedback" class="pvq-muted pvq-account-feedback" aria-live="polite"></p>
                <form id="admin-lesson-editor-form" class="pvq-form-stack" style="display:none">
                    <div class="form-group">
                        <label for="admin-lesson-title">Title</label>
                        <input type="text" id="admin-lesson-title" name="title" placeholder="Nhập title lesson">
                    </div>
                    <div class="form-group">
                        <label for="admin-lesson-description">Description</label>
                        <textarea id="admin-lesson-description" name="description" placeholder="Nhập mô tả lesson"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="admin-lesson-duration">Duration (minutes)</label>
                        <input type="number" min="0" id="admin-lesson-duration" name="durationMin" placeholder="35">
                    </div>
                    <div class="form-group">
                        <label for="admin-lesson-status">Status</label>
                        <select id="admin-lesson-status" name="status">
                            <option value="draft">draft</option>
                            <option value="placeholder">placeholder</option>
                            <option value="ready">ready</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="admin-lesson-video-link">Video link</label>
                        <input type="url" id="admin-lesson-video-link" name="videoLink" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="admin-lesson-musicxml-link">MusicXML link</label>
                        <input type="url" id="admin-lesson-musicxml-link" name="musicxmlLink" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="admin-lesson-midi-link">MIDI link</label>
                        <input type="url" id="admin-lesson-midi-link" name="midiLink" placeholder="https://...">
                    </div>
                    <div class="pvq-course-access-actions">
                        <button type="submit" id="admin-lesson-save-btn" class="cta-btn cta-btn-primary" style="border:none;cursor:pointer">Lưu lesson</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <div id="site-footer-mount"></div>

    <script src="js/auth.js"></script>
    <script src="js/app-common.js"></script>
    <script src="js/site-header.js"></script>
    <script src="js/site-shell.js"></script>
    <script src="js/pages/admin-course-content.js"></script>
</body>
</html>
