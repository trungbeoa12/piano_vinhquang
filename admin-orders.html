<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders — Piano Vinh Quang</title>
    <meta name="description" content="Trang tối thiểu để admin xem và xác nhận các đơn hàng chuyển khoản thủ công.">
    <script src="js/common-head.js"></script>
</head>
<body data-page="admin-orders" data-footer-contact-href="index.html#contact">
    <div class="snowflakes" id="snowflakes"></div>
    <div id="site-header-mount"></div>

    <main class="page-main page-main--account">
        <div class="pvq-account-shell pvq-dashboard-shell">
            <div
                data-site-hero
                data-title="Admin Order Review"
                data-lead="Danh sách đơn hàng đã báo chuyển khoản và chờ admin xác nhận để cấp quyền học."
            ></div>

            <section class="pvq-panel pvq-dashboard-section" style="margin-bottom:24px">
                <p class="pvq-account-kicker">Admin Key</p>
                <h2>Xác thực quản trị tối thiểu</h2>
                <div class="pvq-form-stack">
                    <div class="form-group">
                        <label for="admin-key-input">Admin key</label>
                        <input type="password" id="admin-key-input" placeholder="Nhập ADMIN_ACTION_SECRET">
                    </div>
                    <div class="pvq-course-access-actions">
                        <button type="button" id="admin-key-save-btn" class="cta-btn cta-btn-primary" style="border:none;cursor:pointer">Lưu và tải đơn</button>
                        <button type="button" id="admin-refresh-btn" class="cta-btn cta-btn-secondary" style="border:none;cursor:pointer">Làm mới</button>
                    </div>
                    <p id="admin-orders-feedback" class="pvq-muted pvq-account-feedback" aria-live="polite"></p>
                </div>
            </section>

            <section class="pvq-panel pvq-dashboard-section">
                <p class="pvq-account-kicker">Payment Submitted</p>
                <h2>Đơn hàng chờ xác nhận</h2>
                <div id="admin-orders-list"></div>
            </section>
        </div>
    </main>

    <div id="site-footer-mount"></div>

    <script src="js/auth.js"></script>
    <script src="js/app-common.js"></script>
    <script src="js/site-header.js"></script>
    <script src="js/site-shell.js"></script>
    <script src="js/pages/admin-orders.js"></script>
</body>
</html>
