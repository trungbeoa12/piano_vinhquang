<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Courses — Piano Vinh Quang</title>
    <meta name="description" content="Trang tối thiểu để admin xem danh sách khóa học và đi tới bước sửa nội dung.">
    <script src="js/common-head.js"></script>
</head>
<body data-page="admin-courses" data-footer-contact-href="index.html#contact">
    <div class="snowflakes" id="snowflakes"></div>
    <div id="site-header-mount"></div>

    <main class="page-main page-main--account">
        <div class="pvq-account-shell pvq-dashboard-shell">
            <div
                data-site-hero
                data-title="Admin Courses"
                data-lead="Danh sách khóa học hiện có trong content JSON để chuẩn bị cho bước sửa lesson và cập nhật học liệu."
            ></div>

            <section class="pvq-panel pvq-dashboard-section" style="margin-bottom:24px">
                <p class="pvq-account-kicker">Admin Key</p>
                <h2>Truy cập danh sách khóa học</h2>
                <div class="pvq-form-stack">
                    <div class="form-group">
                        <label for="admin-courses-key-input">Admin key</label>
                        <input type="password" id="admin-courses-key-input" placeholder="Nhập ADMIN_ACTION_SECRET">
                    </div>
                    <div class="pvq-course-access-actions">
                        <button type="button" id="admin-courses-save-btn" class="cta-btn cta-btn-primary" style="border:none;cursor:pointer">Lưu và tải khóa học</button>
                        <button type="button" id="admin-courses-refresh-btn" class="cta-btn cta-btn-secondary" style="border:none;cursor:pointer">Làm mới</button>
                    </div>
                    <p id="admin-courses-feedback" class="pvq-muted pvq-account-feedback" aria-live="polite"></p>
                </div>
            </section>

            <section class="pvq-panel pvq-dashboard-section">
                <p class="pvq-account-kicker">Content</p>
                <h2>Danh sách khóa học</h2>
                <div id="admin-courses-list"></div>
            </section>
        </div>
    </main>

    <div id="site-footer-mount"></div>

    <script src="js/auth.js"></script>
    <script src="js/app-common.js"></script>
    <script src="js/site-header.js"></script>
    <script src="js/site-shell.js"></script>
    <script src="js/pages/admin-courses.js"></script>
</body>
</html>
