<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài học — Piano Vinh Quang</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="templatemo-604-christmas-piano.css">
    <link rel="stylesheet" href="css/app-components.css">
</head>
<body>
    <div class="snowflakes" id="snowflakes"></div>
    <div id="site-header-mount"></div>

    <main class="page-main">
        <p class="pvq-muted"><a href="courses.html" style="color:inherit;text-decoration:none">Khóa học</a> / <span id="lesson-breadcrumb">Bài học</span></p>
        <h1 id="lesson-title" style="font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,3vw,2.2rem);margin:12px 0 8px;color:var(--ivory)">Đang tải…</h1>
        <p id="lesson-subtitle" class="pvq-muted" style="margin-bottom:24px"></p>
        <div id="lesson-access-body"></div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <img src="images/branding/logo-pianovinhquang-main.png" alt="" class="footer-logo-image">
                <span>Piano Vinh Quang</span>
            </div>
            <div class="footer-links">
                <a href="index.html">Trang chủ</a>
                <a href="products.html">Đàn piano</a>
                <a href="courses.html">Khóa học</a>
                <a href="account.html">Tài khoản</a>
                <a href="index.html#contact">Liên hệ</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Copyright © 2026 Piano Vinh Quang.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/app-common.js"></script>
    <script src="js/site-header.js"></script>
    <script src="js/utils/url.js"></script>
    <script src="js/data/courses-catalog.js"></script>
    <script src="js/access-resources.js"></script>
    <script src="js/pages/lesson.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.PVQ_injectSiteHeader('courses');
            window.PVQ_appCommon.createSnowflakes();
            var courseId = window.PVQ_getQueryParam('courseId');
            var lessonId = window.PVQ_getQueryParam('lessonId');
            var found = window.PVQ_findLesson(courseId, lessonId);
            var bc = document.getElementById('lesson-breadcrumb');
            if (bc && found) {
                bc.innerHTML = '<a href="course-detail.html?id=' + encodeURIComponent(courseId) + '" style="color:inherit">' + found.course.title + '</a> / ' + found.lesson.title;
            }
        });
    </script>
</body>
</html>
